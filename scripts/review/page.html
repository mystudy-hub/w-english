<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
  <title>W-English 素材审核工作台</title>
  <style>
    :root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#243b30;background:#f5f4ed;font-size:16px;line-height:1.6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #c8d4cc;background:white;color:#254635;border-radius:10px;padding:8px 14px}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e7a645;outline-offset:3px}button.primary{background:#35624a;color:white;border-color:#35624a}input,select,textarea{border:1px solid #c3d0c5;border-radius:8px;background:#fff;padding:9px;color:inherit}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin:0 9px 0 0}textarea{width:100%;min-height:85px}label{display:block;margin:10px 0}header{padding:26px 4vw 16px;border-bottom:1px solid #d8dfd4;background:#fffef8}header h1{margin:0 0 5px;font-size:27px}header p{margin:4px 0;color:#596b5d}.topline,.actions,.identity{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.topline{justify-content:space-between}.identity label{margin:10px 0}.identity input{max-width:220px}.muted{color:#657567;font-size:14px}.pill{background:#e6eddc;color:#3e5b36;border-radius:99px;padding:4px 12px;font-size:14px}.layout{display:grid;grid-template-columns:275px 1fr;max-width:1300px;margin:24px auto;gap:24px;padding:0 24px}.sidebar{align-self:start;position:sticky;top:16px}.sidebar input,.sidebar select{width:100%;margin-bottom:10px}.items{max-height:65vh;overflow:auto;display:grid;gap:5px;padding:3px}.items button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}.items button[aria-current=true]{background:#deebda;border-color:#6c9270}.items small{font-size:12px;white-space:nowrap}.detail{background:#fffefa;border:1px solid #dae0d3;padding:28px;border-radius:18px;min-height:450px}.detail h2{margin:0;font-size:32px}.word-hero{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center}.word-hero img{width:200px;height:180px;object-fit:contain;background:#f0f2e7;border-radius:20px}.parts{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.part{border:1px solid #d8dfd4;border-radius:10px;padding:10px 14px;text-align:center}.part strong{font-size:24px;display:block}.part small{display:block}.section{border-top:1px solid #e0e4d8;margin-top:22px;padding-top:16px}.section h3{font-size:18px;margin:0 0 10px}.notice{border-radius:10px;padding:12px 16px;background:#faf0d7;color:#73562e}.approved{background:#e6f1df;color:#365b32}.rights{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.rights input{display:block;width:100%}.rights label:last-child{grid-column:1/-1}dl{display:grid;grid-template-columns:90px 1fr;gap:7px 14px}dt{color:#6a7466}dd{margin:0;word-break:break-word}details{margin:16px 0;font-size:13px;color:#5e6e5b}details p{word-break:break-all}#status{min-height:24px;margin:8px 0 0;color:#365b32}#empty{color:#647560}.file-input{display:none}footer{padding:0 24px 24px;text-align:center;color:#6a7568;font-size:13px}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:0 12px}.sidebar{position:static}.items{max-height:220px}.detail{padding:20px}.word-hero{grid-template-columns:1fr}.rights{grid-template-columns:1fr}.word-hero img{width:160px;height:140px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
    .sidebar input[type=checkbox]{width:20px;margin-bottom:0}.sidebar label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px}
  </style>
</head>
<body>
  <header><div class="topline"><div><h1>素材审核工作台</h1><p id="summary"></p></div><span class="pill">W-English · 教学素材</span></div>
    <p>先核对词义、文字与配图，再逐段听审最终语音。导出结果后，由工程端核对并导入。</p>
    <div class="identity"><label>审核人 <input id="reviewer" autocomplete="name" placeholder="填写实际审核人"></label><label>试听音量 <input id="volume" type="range" min="0.1" max="1" step="0.05" value="0.5"></label>
      <button id="stop" type="button">停止试听</button><button id="import" type="button">恢复审核结果</button><input id="import-file" class="file-input" type="file" accept=".json,application/json"><button id="export" class="primary" type="button">导出审核结果</button>
    </div><p id="status" role="status" aria-live="polite"></p>
  </header>
  <main class="layout"><aside class="sidebar"><label class="muted" for="search">查找单词或语音</label><input id="search" type="search" placeholder="单词、中文或片段名"><select id="kind" aria-label="审核类别"><option value="words">文字与配图</option><option value="clips">语音切片</option></select><label><input id="pending" type="checkbox">只看待审</label><div id="items" class="items" aria-label="素材列表"></div></aside><section id="detail" class="detail" aria-label="当前素材"></section></main>
  <footer>图片和已提供的音频包含在此文件中，可离线查看。页面不会上传内容，也不会直接修改工程源文件。</footer>
  <script id="review-data" type="application/json">__REVIEW_DATA__</script>
  <script>__REVIEW_SCRIPT__</script>
</body>
</html>
