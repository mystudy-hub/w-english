/* ================================================================
 * develop-team · 全栈敏捷开发团队配置 v3 (CPA 深度优化版)
 * 更新：2026-09-10  ·  8 人  ·  防卡死（定时器 + 追加式状态 + 唤醒阶梯 + 多模态交叉对抗）
 *
 * 【运行时事实 · 已核对 @giladbarnea/pi-simple-team v1.0.43 源码】
 *   普通成员可用团队工具只有四个：
 *     teamsend  发给成员（to 里不能写 main，resolveRecipients 会抛 Unknown teammate）
 *     teammain  发给主会话
 *     teamstatus  设置/读取公开状态
 *     report_context_window
 *   leader 因 canOverseeOwnTeams:true 还会看到 team_spawn/team_list/team_resume/team_add/teamlog/team_shutdown，
 *     但这些工具只能管理 leader 自己创建的团队，不能管理当前父团队。
 *   不存在 SendMessage / TaskStop / notify_when_idle 这些工具，勿在 prompt 里引用。
 *   schedule_reminder 受 canOverseeOwnTeams 门控（index.ts:841 提前 return），
 *     该值为 false 的成员拿不到定时器，永远无法自唤醒。
 *   没有「停单个成员」的工具：team_shutdown 只接 team 参数、杀整队；
 *     team_resume 只能重启已 stopped 的成员。leader 虽因 canOverseeOwnTeams 看到这两个工具，
 *     但不能操作当前父团队；父团队恢复只能由 main 执行。
 *   系统提示原文：There is no inbox to poll and no done button.
 *     成员结束 turn 后完全静止，只有外部消息能唤醒，且不产生任何事件。
 *   teamlog 的 limit 上限 100，且不落盘，重启即空。
 *
 * 【产物路径 · 唯一事实来源】
 *   docs/PRD.md              product_owner
 *   docs/api-contract.md     architect      [冻结]
 *   docs/design-spec/*.md    ux_designer    [冻结] 分文件：tokens/components/flows/responsive/a11y
 *   docs/team/board.md       leader         独占写，仅追加或单行替换
 *   docs/team/<name>.log     各成员         独占追加，互不写他人文件
 *   docs/runbook.md          devops         启动方式与冒烟结果
 *   docs/qa-report.md        qa_reviewer
 *
 * 【三层防卡死】
 *   L1 leader 持有 schedule_reminder（canOverseeOwnTeams: true），20 分钟巡检自续链；
 *      main 另设 30 分钟兜底探活。两者都是一次性 timer，必须每次重新排下一次，
 *      且普通消息 turn 不得重复排 timer，避免 reminder 累积。
 *   L2 分节落盘 + SECTION DONE 标记 + 追加式 log，任何一次截断最多丢一节。
 *   L3 每个 turn 必须以回报，或「先发消息再设 waiting」收尾，禁止静默结束。
 *
 * 【唤醒阶梯 · 按显式状态与送达结果判定】
 *   runtime 不会因 agent_start/agent_end 自动把成员标成 busy/idle；成员必须主动 teamstatus。
 *   统一状态词：working / waiting / done / blocked / failed；runtime 的 stopped/error 具有更高优先级。
 *   ① 状态为 waiting/done，或任务未终态且超过 20 分钟无 log 增量 → 普通 teamsend 唤醒。
 *   ② 状态为 working 且超过 30 分钟无 log 增量 → teamsend 带 interrupt:true。
 *      child-tools.ts:198 会 abort 当前 context，但等待 settle 默认只有 25 秒；若返回错误，
 *      不得假定消息已送达，下一次巡检必须重试或直接上报 main。
 *   ③ teamsend 是 fire-and-forget，返回 accepted 不代表 recipient 已处理。必须在下一次巡检
 *      检查显式 teamstatus、成员 log 与 runtime error；连续两次无进展才升级。
 *   ④ leader 不能停止或 resume 父团队成员。leader 用 teammain 上报 main；main 使用
 *      team_shutdown（整队）后 team_resume({team: team_spawn 返回的 id, teammates:[name]})。
 *   ⑤ 同一环节反复截断 → 换模型或降 thinking，记入 docs/team/board.md 备注。
 *
 * 【spawn 前置检查 · main 必须实际执行，不是注释性建议】
 *   1) 单 agent 探活 cpa 凭据。401 会导致整队静默死循环。
 *   2) 必须使用 cpa/ 前缀合法模型 ID，严禁使用未注册的 claude-bridge/ 前缀（会导致 exit code 1 闪退）。
 *   3) 建立 docs/team 与 docs/design-spec 目录。
 *   4) 保存 team_spawn 返回值里的持久化 id；若 id 为空，说明当前 main session 不满足持久化
 *      resume 前提，必须先修复 session，再继续派发。team_resume 的 team 参数必须使用这个 id，
 *      不能依赖 develop-team 名称，尤其是存在多个 team 时；manifest 仅保留 dormant 30 天。
 *   5) spawn 成功后立刻给 8 名成员各发一条短消息，确认 deliveryUrl 可用并促使其开始首轮。
 *      若消息返回 accepted 但成员状态转为 error，立即记录并停止继续派发。
 *   6) main 自己排一个 [MAIN_WATCHDOG_TICK] 的 30 分钟 schedule_reminder；每次 tick 第一件事先
 *      重排下一次，再检查 leader 状态、leader log、teamstatus 和各成员 context window。main 是唯一
 *      能执行 team_shutdown / team_resume 的层级；main 进程退出时所有 timer 都会消失，不能假设有后台守护。
 *   7) 任何全队 shutdown 前先确认各成员产物已落盘；resume 后逐个 teamsend，要求从最后一个
 *      SECTION DONE 或自身 log 最后一行继续，不得从头重做。
 *
 * 【模型选择依据 · CPA 实测参数与角色匹配策略】
 *   -----------------------------------------------------------------------------------------
 *   模型标识                     Context   Max-Out   Thinking  Images   推荐岗位与选型理由
 *   -----------------------------------------------------------------------------------------
 *   cpa/claude-opus-5           1.0M      128K      yes       yes      leader(看门狗/统筹), frontend_coder(顶级UI代码)
 *   cpa/gpt-5.6-sol             1.1M      128K      yes       yes      product_owner(PRD/需求), ux_designer(读图/设计规范)
 *   cpa/gpt-5.6-terra           1.1M      128K      yes       yes      architect(严格契约冻结/零TBD/数据库建模)
 *   cpa/deepseek-v4-pro         1.0M      384K      yes       no       backend_coder(全场唯一384K超长输出/长业务逻辑与穷尽单测)
 *   cpa/gpt-5.6-luna            1.1M      128K      yes       yes      devops(敏捷构建/环境/脚本/runbook) [也可备选后端]
 *   cpa/grok-4.6                500K      128K      yes       yes      qa_reviewer(跨模型对抗审查/敏锐挑错/防思维盲区)
 *   -----------------------------------------------------------------------------------------
 *   【避坑禁选池 · 严重受限模型】
 *   cpa/gemini-3.8-flash-high   1.0M      8.2K      yes       no       ← Max-Out仅8.2K，代码与文档极易被截断损坏
 *   cpa/gemini-3.1-flash-image  32.8K     8.2K      no        no       ← 上下文及输出严重过小
 *   cpa/codex-auto-review       32.8K     8.2K      yes       no       ← 上下文过小，无法支撑整项目审计
 *   cpa/gpt-5.6 / luna-2 / free 32.8K     8.2K      yes       no       ← 上下文过小，多轮后直接溢出崩溃
 * ================================================================ */

team_spawn({
  team: "develop-team",
  teamPrompt: "我们是全栈敏捷开发团队：PO 定需求、架构师定 API 契约、UX 定设计规范，三者冻结后由 leader 拆解，前后端并行编码，DevOps 集成跑通，QA 审查，leader 闭环。【工具事实·不要臆造工具名】普通成员有四个团队工具：teamsend（发给成员，to 里不能写 main）、teammain（发给主会话）、teamstatus（设置/读取状态）、report_context_window。leader 因 canOverseeOwnTeams:true 还会看到 team_spawn、team_list、team_resume、team_add、teamlog、team_shutdown，但这些 manager tools 只能管理 leader 自己创建的团队，不能管理当前父团队；leader 仍必须通过 teamsend 与父团队成员通信、通过 teammain 通知 main。不存在 SendMessage、TaskStop、notify_when_idle。【产物路径·唯一事实来源】docs/PRD.md、docs/api-contract.md、docs/design-spec/*.md、docs/team/board.md、docs/runbook.md、docs/qa-report.md。一切以文件为准，不以记忆为准；冲突时以文件最新版本为准；引用上游结论前必须先读文件，不得凭印象转述。【状态上报·追加式，禁止重写他人文件】你只写两类文件：自己的产物，和 docs/team/<你的名字>.log。log 每次追加一行，格式为「ISO时间 | task_id | 状态(START/PROGRESS/DONE/BLOCKED/FAILED) | 产物路径 | 当前章节/下一步 | 一句话」。收到任务先追加 START，并调用 teamstatus({gerund:'working', phrase:'task_id=...'})；每完成一个可验证步骤或长命令前追加 PROGRESS；等待依赖时先发消息再将状态设为 waiting；结束 turn 前必须追加 DONE、BLOCKED 或 FAILED，并将 teamstatus 设成对应状态。runtime 不会自动维护 busy/idle，不能省略这些显式状态。没有 log 增量不能声称有进展。只有 leader 写 docs/team/board.md。禁止任何人整体重写 board.md 或他人 log。【防截断写入协议·全员强制】1) 任何超过 150 行的产物必须分节，每节单独一次写入，写完立即落盘，并在文件末尾追加完成标记 <!-- SECTION: 节名 DONE -->；2) 禁止把长内容放进消息正文，消息只放路径、状态、3 行摘要，单条不超过 25 行；3) 每写完一节立刻往自己的 log 追加一行 PROGRESS，这样任何一次截断最多丢一节，且下一个人能从标记看出续写位置；4) 若发现自己上一条输出被截断，读回目标文件，找最后一个 SECTION DONE 标记，从下一节续写，禁止重头再来。【turn 结束契约·全员强制·这是防卡死的核心】系统里没有收件箱、没有轮询、没有完成按钮。你结束 turn 后会完全静止，只有别人发消息才能唤醒你。因此每一个 turn 都必须以下面两种之一收尾，禁止静默结束：A) 已产出阶段成果 → 先将最终状态追加到自己的 log，再 teamsend 给 leader；正文必须是三种终态之一——[DONE] 产物路径 + 3 行摘要 + 下游该看哪几节；[BLOCKED] 卡在哪个依赖 + 需要谁提供什么 + 已完成到哪（含路径）；[FAILED] 失败原因 + 中间产物路径 + 建议下一步。B) 必须等别人 → 先 teamsend 给等待对象，明确写「完成 X 后请 teamsend 唤醒我」；等待 main 时用 teammain；再 teamstatus 设为 waiting，最后才结束 turn。先发消息后设等待状态，顺序不能反；没发消息就设 waiting 等于自杀。leader 禁止设置 waiting，必须排好下一次 watchdog tick 后结束。宁可误报 [BLOCKED]，不可失联。【被唤醒时】收到任何消息先 teamstatus 确认收到该条消息，再干活。若消息是探活（内容为「检查你上一条输出是否完整」），立即按防截断协议第 4 条自查并回报，不要重启任务。【契约冻结】API 契约与设计规范一经冻结不得单方修改，需变更时向 leader 提交申请，由 leader 裁决并同步全员，变更记入 docs/team/board.md。【返工收敛】QA 问题按 P0(阻塞)/P1(必修)/P2(建议) 分级，仅 P0/P1 打回，P2 记入遗留项不阻塞交付；同一模块返工最多 2 轮，第 3 轮由 leader 裁决收敛。",

